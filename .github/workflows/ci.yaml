name: CI

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  SERVICE_COMMONS_PACKAGES_REPOSITORY: michele2021/service-commons
  GITHUB_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
  GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate GitHub Packages credentials
        run: |
          test -n "${GITHUB_PACKAGES_USER}" || (echo "Missing secret: GH_PACKAGES_USER" && exit 1)
          test -n "${GITHUB_PACKAGES_TOKEN}" || (echo "Missing secret: GH_PACKAGES_TOKEN" && exit 1)
      - name: Build and test
        run: ./gradlew build
