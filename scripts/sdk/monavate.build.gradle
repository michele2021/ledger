plugins {
    id 'net.researchgate.release' version '2.7.0'
    id 'maven-publish'
}

apply plugin: 'idea'
apply plugin: 'java'

group = 'com.accounting.core'
version = '1.22.2'

def getMavenSettingsCredentials = {
    String userHome = System.getProperty( "user.home" );
    File mavenSettings = new File(userHome, ".m2/settings.xml")
    def xmlSlurper = new XmlSlurper()
    def output = xmlSlurper.parse(mavenSettings)
    return output."servers"."server"
}

def getS3Credentials = { credentials ->
    def entries = getMavenSettingsCredentials()
    for (entry in entries) {
        if ( entry."id".text() == "maven.cleverbug.com" ) {
            credentials.setAccessKey(entry.username.text())
            credentials.setSecretKey(entry.password.text())
            return
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url "s3://maven.cleverbug.com/release"
        credentials(AwsCredentials, getS3Credentials)
    }
    maven {
        url "s3://maven.cleverbug.com/snapshot"
        credentials(AwsCredentials, getS3Credentials)
    }
    maven { url "https://plugins.gradle.org/m2/" }

}
sourceSets {
    main.java.srcDirs = ['src/main/java']
}

apply plugin: 'java'

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

jar {
    into('lib') {
        from 'libs'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.accounting'
        }
    }
}

publishing {
    repositories {
        maven {
            /*if (project.version.endsWith('-SNAPSHOT')) {
                url "s3://maven.cleverbug.com/snapshot"
            } else {
                url "s3://maven.cleverbug.com/release"
            }*/
            url "s3://maven.cleverbug.com/release"
            credentials(AwsCredentials, getS3Credentials)
        }
    }
}

afterReleaseBuild.dependsOn publish

release {
    failOnCommitNeeded = true
    failOnPublishNeeded = false
}


publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'monavate-iban-java-client'
            from components.java
        }
    }
}

task execute(type:JavaExec) {
    main = System.getProperty('mainClass')
    classpath = sourceSets.main.runtimeClasspath
}

ext {
    jakarta_annotation_version = "1.3.5"
}

dependencies {
    implementation 'io.swagger:swagger-annotations:1.6.5'
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'io.gsonfire:gson-fire:1.8.5'
    implementation 'javax.ws.rs:javax.ws.rs-api:2.1.1'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.3'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.12.0'
    implementation "jakarta.annotation:jakarta.annotation-api:$jakarta_annotation_version"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testImplementation 'org.mockito:mockito-core:3.12.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
}

javadoc {
    options.tags = [ "http.response.details:a:Http Response Details" ]
}

test {
    useJUnitPlatform()

    // Always run tests, even when nothing changed.
    dependsOn 'cleanTest'

    // Show test results.
    testLogging {
        events "passed", "skipped", "failed"
    }
}
