tasks.withType(JavaCompile) {
}

tasks.withType(Test) {
}

tasks.withType(JavaExec) {
    jvmArgs += ['-XX:+UseG1GC', '-XX:+UseStringDeduplication']
}

test {
    useJUnitPlatform()
    filter {
        excludeTestsMatching "com.accounting.core.testUtils.*"
    }
}
