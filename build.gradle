plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1' // necessary to build the shadowJar (fatJar)
}

apply plugin: 'maven-publish'

group 'com.accounting.core'

application {
    mainClass = 'com.accounting.core.AccountingCoreApp'
}

def getMavenSettingsCredentials = {
    String userHome = System.getProperty('user.home')
    File mavenSettings = new File(userHome, '.m2/settings.xml')
    def xmlSlurper = new groovy.xml.XmlSlurper()
    def output = xmlSlurper.parse(mavenSettings)
    return output.'servers'.'server'
}

def getS3Credentials = { credentials ->
    def entries = getMavenSettingsCredentials()
    for (entry in entries) {
        if (entry.'id'.text() == 'maven.cleverbug.com') {
            credentials.setAccessKey(entry.username.text())
            credentials.setSecretKey(entry.password.text())
            return
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url s3_release_repository
        credentials(AwsCredentials, getS3Credentials)
    }
    maven {
        url s3_snapshot_repository
        credentials(AwsCredentials, getS3Credentials)
    }
}

project.ext {
    accounting_commons_version = '5.96-SNAPSHOT'
    // monavate_iban_version = '1.22.2'

    dropwizard_version = "4.0.11"
    lombok_version = '1.18.36'
    jdbi3_version = '3.47.0'
    awssdk_version = '2.17.216'

    junit_jupiter_version = '5.11.3'
    mockito_version = '5.14.2'
}

dependencies {
    // TODO what is this?
    implementation 'in.vectorpro.dropwizard:dropwizard-swagger:2.0.28-3'
    implementation "com.accounting.commons:accounting-commons:${accounting_commons_version}"

    implementation "io.dropwizard:dropwizard-core:${dropwizard_version}"
    implementation "io.dropwizard:dropwizard-auth:${dropwizard_version}"
    implementation "io.dropwizard:dropwizard-jdbi3:${dropwizard_version}"
    testImplementation "io.dropwizard:dropwizard-testing:${dropwizard_version}"

    implementation platform("software.amazon.awssdk:bom:${awssdk_version}")
    implementation "software.amazon.awssdk:sqs:${awssdk_version}"
    implementation "software.amazon.awssdk:sns:${awssdk_version}"

    implementation 'org.postgresql:postgresql:42.7.4'
    implementation "org.jdbi:jdbi3-sqlobject:${jdbi3_version}"
    // TODO not available on maven repo?
    implementation group: 'org.jdbi', name: 'jdbi3-gson2', version: '3.36.0'
    implementation "org.jdbi:jdbi3-postgres:${jdbi3_version}"

    implementation 'com.google.inject:guice:7.0.0'
    implementation 'com.google.code.gson:gson:2.8.9'
    // TODO what is this??
    implementation 'com.networknt:json-schema-validator:1.0.68'

    // implementation "com.accounting:monavate-iban-java-client:${monavate_iban_version}"

    compileOnly "org.projectlombok:lombok:${lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${lombok_version}"

    testCompileOnly "org.projectlombok:lombok:${lombok_version}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombok_version}"

    testImplementation "org.junit.jupiter:junit-jupiter-api:${junit_jupiter_version}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${junit_jupiter_version}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junit_jupiter_version}"

    testImplementation "org.mockito:mockito-core:${mockito_version}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockito_version}"

    testImplementation "org.assertj:assertj-core:3.26.3"
    testImplementation "org.jdbi:jdbi3-testing:${jdbi3_version}"
    testImplementation 'org.liquibase.ext:liquibase-postgresql:4.8.0'
}

run {
    args 'server', 'server.yaml'
}

compileJava {
    options.compilerArgs << '-parameters'
}

shadowJar {
    mergeServiceFiles()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.accounting.core'
        }
    }
}

publishing {
    repositories {
        maven {
            if (project.version.endsWith('-SNAPSHOT')) {
                url project.s3_snapshot_repository
            } else {
                url project.s3_release_repository
            }
            credentials(AwsCredentials, getS3Credentials)
        }
    }
}

test {
    useJUnitPlatform()
    filter {
        excludeTestsMatching "com.accounting.core.testUtils.*"
    }
}

