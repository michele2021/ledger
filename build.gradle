def serviceCommonsPackagesRepository = findProperty('serviceCommonsPackagesRepository')
        ?: System.getenv('SERVICE_COMMONS_PACKAGES_REPOSITORY')
        ?: 'michele2021/service-commons'
def githubPackagesUser = findProperty('githubPackagesUser')
        ?: System.getenv('GITHUB_PACKAGES_USER')
        ?: System.getenv('GITHUB_ACTOR')
def githubPackagesToken = findProperty('githubPackagesToken')
        ?: System.getenv('GITHUB_PACKAGES_TOKEN')
        ?: System.getenv('GITHUB_TOKEN')

repositories {
    mavenLocal()
    maven {
        url = uri("https://maven.pkg.github.com/${serviceCommonsPackagesRepository}")
        credentials {
            username = githubPackagesUser
            password = githubPackagesToken
        }
    }
    mavenCentral()
    /*maven {
        url s3_release_repository
        credentials(AwsCredentials, getS3Credentials)
    }
    maven {
        url s3_snapshot_repository
        credentials(AwsCredentials, getS3Credentials)
    }*/
}

project.ext {
    service_commons_version = '1.0-SNAPSHOT'

    dropwizard_version = "5.0.1"
    lombok_version = '1.18.42'
    jdbi3_version = '3.51.0'
    awssdk_version = '2.29.0'
    kafka_clients_version = '4.2.0'

    junit_jupiter_version = '6.0.3'
    mockito_version = '5.22.0'
}

dependencies {
    implementation 'com.smoketurner:dropwizard-swagger:4.0.5-1'
    implementation "com.accounting.commons:service-commons:${service_commons_version}"

    implementation "io.dropwizard:dropwizard-core:${dropwizard_version}"
    implementation "io.dropwizard:dropwizard-auth:${dropwizard_version}"
    implementation "io.dropwizard:dropwizard-jdbi3:${dropwizard_version}"
    testImplementation "io.dropwizard:dropwizard-testing:${dropwizard_version}"

    // Kafka
    implementation "org.apache.kafka:kafka-clients:${kafka_clients_version}"

    implementation platform("software.amazon.awssdk:bom:${awssdk_version}")
    implementation "software.amazon.awssdk:sqs:${awssdk_version}"
    implementation "software.amazon.awssdk:sns:${awssdk_version}"

    implementation 'org.postgresql:postgresql:42.7.10'
    implementation "org.jdbi:jdbi3-sqlobject:${jdbi3_version}"
    implementation "org.jdbi:jdbi3-gson2:${jdbi3_version}"
    implementation "org.jdbi:jdbi3-postgres:${jdbi3_version}"

    compileOnly "org.projectlombok:lombok:${lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${lombok_version}"

    testCompileOnly "org.projectlombok:lombok:${lombok_version}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombok_version}"

    implementation 'com.google.inject:guice:7.0.0'
    implementation 'com.google.code.gson:gson:2.12.2'
    implementation 'com.networknt:json-schema-validator:1.5.6'

    // implementation "com.accounting:monavate-iban-java-client:${monavate_iban_version}"

    testImplementation "org.junit.jupiter:junit-jupiter-api:${junit_jupiter_version}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${junit_jupiter_version}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junit_jupiter_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_jupiter_version}"

    testImplementation "org.mockito:mockito-core:${mockito_version}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockito_version}"

    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation "org.jdbi:jdbi3-testing:${jdbi3_version}"
    testImplementation 'org.liquibase.ext:liquibase-postgresql:5.0.1'
}

run {
    args 'server', 'server.yaml'
}

compileJava {
    options.compilerArgs << '-parameters'
}

shadowJar {
    mergeServiceFiles()
    enabled = project.hasProperty('buildShadowJar') && project.buildShadowJar == 'true'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.accounting.core'
        }
    }
}

tasks.register('generateOpenAPI', JavaExec) {
    description = 'Generate OpenAPI specification'
    group = 'documentation'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.accounting.core.swagger.OpenApiGenerator'
}

